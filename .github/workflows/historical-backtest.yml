name: Historical Backtest Note

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Explain repository backtest policy
        run: |
          echo "M-0-M is refreshed by the separate trading-day baseline workflow."
          echo "M-1-M and M-2-M remain frozen historical research curves."
          echo "docs/data/data.json combines the M-0-M baseline with frozen research curves."
          echo "Use build/update_backtest_site.py with a compatible panel to rebuild M-1-M/M-2-M historical curves."
